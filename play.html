<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Hash Rush · Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Barlow+Condensed:wght@500;600;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: var(--ink); overflow: hidden; font: 15px/1.5 var(--text); }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; opacity: 0; transition: opacity 1s; }
  body.ready canvas#c { opacity: 1; }
  canvas#c.drag { cursor: grabbing; }
  .shade { position: fixed; inset: 0; pointer-events: none; background: linear-gradient(90deg, #000b 0%, #0004 26%, #0000 46%), linear-gradient(#0000 70%, #000a 100%), linear-gradient(#0008 0%, #0000 18%); }

  /* planet, top left */
  .hud { position: fixed; left: 48px; top: 40px; width: min(380px, calc(100vw - 96px)); }
  .hud h1 { font: 400 clamp(30px, 3.4vw, 46px)/1.05 var(--display); letter-spacing: 0.02em; margin: 10px 0 6px; text-shadow: 0 4px 24px #000; }
  .hud .tagline { color: #b8b0a2; font-weight: 300; text-shadow: 0 2px 10px #000; }
  .meter { position: relative; height: 4px; margin: 22px 0 10px; background: #ffffff1c; overflow: hidden; }
  .meter i { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, var(--a-lo), var(--a-hi)); box-shadow: 0 0 12px var(--a); transition: width 1.2s cubic-bezier(.2, .8, .2, 1); }
  .meter::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, #0000 0 22px, #000c 22px 24px); }
  .nums { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--mute); }
  .nums b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* you, top right */
  .me { position: fixed; right: 40px; top: 36px; display: flex; align-items: center; gap: 18px; }
  .who-wrap { position: relative; }
  .who { display: block; text-align: right; line-height: 1.25; background: none; border: 0; padding: 4px 0; color: var(--ink); font: inherit; cursor: default; }
  .who.menu { cursor: pointer; }
  .who.menu b::after { content: ''; display: inline-block; width: 6px; height: 6px; margin: 0 0 4px 9px; border-right: 1.5px solid var(--mute); border-bottom: 1.5px solid var(--mute); transform: rotate(45deg); transition: transform 0.25s, border-color 0.2s; }
  .who.menu:hover b::after, .who.menu:focus-visible b::after { border-color: var(--ink); }
  .who[aria-expanded="true"] b::after { transform: rotate(225deg) translate(-3px, -3px); }
  .who:focus-visible { outline: 1px solid var(--a); outline-offset: 4px; }
  .me-menu { position: absolute; right: 0; top: calc(100% + 10px); z-index: 10; min-width: 160px; padding: 8px 16px; text-align: right; background: var(--glass); border: 1px solid var(--line); box-shadow: 0 20px 40px #000b; animation: feed-in 0.2s cubic-bezier(.2, .8, .2, 1); }
  .me-menu .link { display: block; margin-left: auto; padding: 7px 0; font-size: 15px; }
  .who small { display: block; font: 600 11px var(--label); letter-spacing: 0.3em; text-transform: uppercase; color: var(--mute); }
  .who b { font: 400 17px var(--display); letter-spacing: 0.02em; }

  /* what just happened, bottom left */
  /* kill feed: one compact row per hit, newest on top, older rows fade */
  .feed { position: fixed; left: 48px; bottom: 40px; width: min(460px, calc(100vw - 96px)); display: flex; flex-direction: column; align-items: flex-start; gap: 5px; pointer-events: none; }
  .feed .row { display: flex; align-items: center; gap: 8px; max-width: 100%; padding: 5px 10px 5px 8px; background: #000a; border-left: 2px solid var(--pc, var(--a)); font-size: 14px; color: #d8d0c2; animation: feed-in 0.3s cubic-bezier(.2, .8, .2, 1); transition: opacity 1s; }
  .feed .row .who { font-weight: 600; white-space: nowrap; }
  .feed .row .ar { color: #5d574e; }
  .feed .row .wchip { font: 600 11px var(--label); letter-spacing: 0.12em; text-transform: uppercase; padding: 1px 7px; border: 1px solid currentColor; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .feed .row .num { color: var(--a-hi); font-weight: 600; font-variant-numeric: tabular-nums; }
  .feed .row em { font-style: normal; color: var(--mute); }
  .feed .row.hash { background: #ff6a1acc; color: #140700; border-left-color: #fff; }
  .feed .row.hash b { color: #140700; }
  .feed .row.old { opacity: 0.35; }
  .feed .rar-Abundant { color: #9aa0a6; } .feed .rar-Common { color: #c9c3b8; } .feed .rar-Rare { color: #5aa9ff; } .feed .rar-Epic { color: #c66bff; } .feed .rar-Legendary { color: #ffa53d; } .feed .rar-Mythical { color: #ff4d6d; }
  @keyframes feed-in { from { opacity: 0; transform: translateX(-12px); } }

  /* your loadout, bottom right */
  .loadout { position: fixed; right: 40px; bottom: 40px; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; text-align: right; }
  /* your two cards docked into the plate like cartridges, the damage and the trigger on the plate */
  .dock { display: flex; align-items: flex-end; gap: 26px; }
  .dtiles { order: 2; display: flex; gap: 10px; }
  .dtile { position: relative; width: 112px; height: 150px; padding: 0; overflow: hidden; cursor: pointer; text-align: left; color: var(--ink); font: inherit; background: #0b0908; border: 1px solid var(--rc, #ffffff33);
    box-shadow: 0 0 22px color-mix(in srgb, var(--rc, #000) 35%, transparent), inset 0 0 0 1px #0006; transform: rotate(-4deg); transition: transform 0.35s cubic-bezier(.2, .8, .2, 1), box-shadow 0.3s; }
  .dtile + .dtile { transform: rotate(3deg) translateY(4px); }
  .dtile:hover, .dtile:focus-visible { transform: rotate(-6deg) translateY(-8px); box-shadow: 0 0 34px color-mix(in srgb, var(--rc, #000) 55%, transparent); outline: none; }
  .dtile + .dtile:hover, .dtile + .dtile:focus-visible { transform: rotate(5deg) translateY(-6px); }
  .dtile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 30%; transform: scale(2.1); transform-origin: 50% 33%; }
  .dtile::after { content: ''; position: absolute; inset: 0; background: linear-gradient(#0000 38%, #000e); pointer-events: none; }
  .dtile .t { position: absolute; left: 8px; right: 8px; bottom: 7px; z-index: 1; line-height: 1.15; }
  .dtile .t span { display: block; font: 600 10px var(--label); letter-spacing: 0.16em; text-transform: uppercase; color: var(--rc); }
  .dtile .t b { display: block; font-size: 13px; font-weight: 600; }
  .dtile .shb { position: absolute; top: 7px; right: 7px; z-index: 1; padding: 2px 6px; font: 600 10px var(--label); letter-spacing: 0.12em; text-transform: uppercase; color: #000; }
  .dtile.empty { border-style: dashed; border-color: #ffffff40; box-shadow: none; background: #0b0908cc; }
  .dtile.empty::after { display: none; }
  .dtile.empty .t { top: 50%; bottom: auto; transform: translateY(-50%); text-align: center; }
  .dtile.empty .t span { color: var(--mute); } .dtile.empty .t b { color: var(--a-hi); font: 600 12px var(--label); letter-spacing: 0.15em; text-transform: uppercase; margin-top: 4px; }
  /* damage and trigger to the left of the cards, straight on the scene (no panel behind) */
  .plate { order: 1; display: flex; align-items: center; gap: 20px; }
  .plate .n { text-align: right; text-shadow: 0 2px 14px #000, 0 0 2px #000; }
  .plate .n small { color: #b8b0a2; }
  .plate .n b { display: block; font: 400 38px/1 var(--display); color: var(--a-hi); }
  .plate .btn.attack { padding: 20px 30px; font-size: 18px; min-width: 190px; }
  .btn.big { padding: 18px 50px; font-size: 18px; }
  /* attack: recharging plate with a filling stripe, and a burst when it is ready again */
  .fire { position: relative; display: inline-block; }
  .fire .burst { position: absolute; inset: -20px -30px; pointer-events: none; opacity: 0; background: radial-gradient(closest-side, #ff9a50aa, #ff6a1a40 55%, #0000 78%); }
  .fire .burst::after { content: ''; position: absolute; inset: 20px 30px; border: 2px solid var(--a-hi); transform: skewX(-14deg); opacity: 0; }
  .fire.charged .burst { animation: charged-idle 2.6s ease-in-out infinite; }
  .fire.flash .burst { animation: ready-burst 1.2s cubic-bezier(.2, .8, .2, 1) 1; }
  .fire.flash .burst::after { animation: ready-ring 1.1s cubic-bezier(.2, .8, .2, 1) 1; }
  .fire.flash .btn { animation: ready-pop 0.75s cubic-bezier(.2, .8, .2, 1) 1, btn-glitch 0.34s steps(1) 0.3s 1; }
  .btn.attack .lbl { position: relative; font-variant-numeric: tabular-nums; }
  .btn.attack .cd { display: none; position: absolute; inset: 0 auto 0 0; width: 0; z-index: -1; background: repeating-linear-gradient(-45deg, #ff6a1a66 0 8px, #ff6a1a2e 8px 16px); background-size: 22.6px 22.6px; border-right: 2px solid var(--a-hi); animation: cd-stripes 0.9s linear infinite; transition: width 0.25s linear; }
  .btn.attack.cooling { color: #eadfcd; letter-spacing: 0.2em; cursor: progress; background: repeating-linear-gradient(0deg, #ffffff08 0 1px, #0000 1px 3px), linear-gradient(180deg, #2a2420, #120f0c); }
  .btn.attack.cooling, .btn.attack.cooling:disabled { filter: none; }
  .btn.attack.cooling .cd { display: block; }
  @keyframes cd-stripes { to { background-position: 22.6px 0; } }
  @keyframes ready-burst { 0% { opacity: 1; transform: scale(0.7); } 60% { opacity: 0.8; } 100% { opacity: 0; transform: scale(1.55); } }
  @keyframes ready-ring { 0% { opacity: 1; transform: skewX(-14deg) scale(1); } 100% { opacity: 0; transform: skewX(-14deg) scale(1.45, 2); } }
  @keyframes ready-pop { 0% { transform: scale(1); filter: brightness(2.3) saturate(1.5); } 35% { transform: scale(1.08); } 100% { transform: scale(1); filter: none; } }
  @keyframes charged-idle { 0%, 100% { opacity: 0.1; } 50% { opacity: 0.36; } }
  @media (prefers-reduced-motion: reduce) { .fire .burst, .fire .burst::after, .fire.flash .btn, .btn.attack .cd { animation: none !important; } }
  .loadout .status { margin: 0; max-width: 380px; font-size: 14px; }
  .loadout small { display: block; font: 600 11px var(--label); letter-spacing: 0.3em; text-transform: uppercase; color: var(--mute); }
  .loadout b { font-weight: 500; }

  /* hash found */
  .banner { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.6s; }
  .banner.on { opacity: 1; }
  .banner h2 { font: 400 clamp(34px, 5vw, 70px)/1.05 var(--display); margin: 10px 0; text-shadow: 0 0 40px var(--a), 0 4px 30px #000; }
  .banner p { margin: 0; font-size: 18px; color: #e8dfcf; text-shadow: 0 2px 12px #000; }

  /* names in space */
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .tag { position: absolute; left: 0; top: 0; white-space: nowrap; font: 600 12px var(--label); letter-spacing: 0.18em; text-transform: uppercase; color: #e8e2d6d9; text-shadow: 0 1px 6px #000; transition: opacity 0.3s; }
  .tag i { display: inline-block; width: 10px; height: 2px; margin-right: 6px; vertical-align: 4px; }
  .tag.mine { color: #fff; }
  .tag.firing { color: #fff; }
  .tag.firing::after { content: attr(data-weapon); margin-left: 8px; color: var(--a); letter-spacing: 0.1em; }
  .tag.hidden { opacity: 0.18; }

  .busy { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 600 13px var(--label); letter-spacing: 0.4em; text-transform: uppercase; color: var(--a); }
  .err { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; }

  /* ---------------------------------------------------------------- hangar */
  dialog.hangar { width: min(1180px, calc(100vw - 32px)); height: min(780px, calc(100vh - 32px)); max-width: none; max-height: none; padding: 0; border: 1px solid var(--line); background: var(--glass); color: var(--ink); box-shadow: 0 40px 100px #000d; }
  dialog.hangar::backdrop { background: #000b; backdrop-filter: blur(4px); }
  .hg { display: grid; grid-template-rows: auto auto 1fr auto; height: 100%; }
  .hg-top { display: flex; justify-content: space-between; align-items: flex-start; padding: 28px 34px 10px; }
  .hg-top h2 { font: 400 26px var(--display); margin: 8px 0 0; }
  .tabs { display: flex; gap: 6px; padding: 0 34px; border-bottom: 1px solid var(--line); }
  .tabs button { position: relative; background: none; border: 0; color: var(--mute); cursor: pointer; font: 600 14px var(--label); letter-spacing: 0.3em; text-transform: uppercase; padding: 14px 16px; transition: color 0.2s; }
  .tabs button::after { content: ''; position: absolute; left: 16px; right: 16px; bottom: -1px; height: 2px; background: var(--a); transform: scaleX(0); transition: transform 0.3s cubic-bezier(.2, .8, .2, 1); }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-selected="true"] { color: var(--ink); }
  .tabs button[aria-selected="true"]::after { transform: scaleX(1); }
  .hg-body { display: grid; grid-template-columns: 360px 1fr; min-height: 0; }
  .list-col { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
  .filters { display: flex; align-items: center; gap: 12px; padding: 16px 20px 12px 34px; }
  .filters input[type=search] { flex: 1; min-width: 0; font: 400 15px var(--text); color: var(--ink); background: #ffffff0d; border: 1px solid #ffffff1f; border-radius: 2px; padding: 8px 10px; outline: none; }
  .filters input[type=search]:focus { border-color: var(--a); }
  .switch { display: flex; align-items: center; gap: 8px; cursor: pointer; font: 600 12px var(--label); letter-spacing: 0.2em; text-transform: uppercase; color: var(--mute); white-space: nowrap; user-select: none; }
  .switch input { appearance: none; width: 34px; height: 18px; margin: 0; border: 1px solid #ffffff33; background: #ffffff0d; position: relative; cursor: pointer; transition: background 0.2s, border-color 0.2s; }
  .switch input::after { content: ''; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; background: var(--mute); transition: transform 0.25s cubic-bezier(.2, .8, .2, 1), background 0.2s; }
  .switch input:checked { background: #ff6a1a33; border-color: var(--a); }
  .switch input:checked::after { transform: translateX(16px); background: var(--a); }
  .switch:has(input:checked) { color: var(--ink); }
  .list { overflow-y: auto; padding: 0 20px 20px 34px; }
  .item { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-left: 2px solid transparent; color: var(--ink); cursor: pointer; padding: 8px 10px; margin: 2px 0; font: inherit; transition: background 0.2s, border-color 0.2s; }
  .item:hover { background: #ffffff0a; }
  .item[aria-current="true"] { background: #ff6a1a14; border-left-color: var(--a); }
  .item img { width: 44px; height: 60px; object-fit: cover; background: #ffffff0d; }
  .item .nm { font-weight: 500; line-height: 1.2; }
  .item .rr { display: block; font: 600 11px var(--label); letter-spacing: 0.2em; text-transform: uppercase; margin-top: 3px; }
  .item .own { font: 600 11px var(--label); letter-spacing: 0.15em; text-transform: uppercase; color: var(--mute); white-space: nowrap; }
  .item .own.yes { color: #7dffb2; }
  .item.dim .nm, .item.dim img { opacity: 0.5; }
  .detail { display: grid; grid-template-columns: 1.1fr 1fr; min-height: 0; }
  .preview { position: relative; background: #000; }
  .preview canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .info { padding: 26px 34px; overflow-y: auto; }
  .info h3 { font: 400 26px/1.15 var(--display); margin: 8px 0 6px; }
  .info .meta { color: var(--mute); font-size: 14px; }
  .shines { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 18px; }
  .shine { position: relative; min-width: 96px; text-align: left; background: #ffffff08; border: 1px solid #ffffff22; color: var(--ink); cursor: pointer; padding: 8px 12px; font: inherit; transition: border-color 0.2s, background 0.2s; }
  .shine b { display: block; font: 600 13px var(--label); letter-spacing: 0.15em; text-transform: uppercase; }
  .shine span { font-size: 12px; color: var(--mute); }
  .shine.owned span { color: #7dffb2; }
  .shine.missing { border-style: dashed; opacity: 0.6; }
  .shine:hover { border-color: #ffffff55; opacity: 1; }
  .shine[aria-pressed="true"] { border-color: var(--a); background: #ff6a1a1a; opacity: 1; }
  .shine.Gold b { color: #f2c14e; } .shine.XDimension b { color: #b29bff; } .shine.Stardust b { color: #bcd6ff; } .shine.Antimatter b { color: #ff5ae8; }
  .dmg { display: flex; gap: 26px; margin-bottom: 16px; font-size: 14px; color: var(--mute); }
  .dmg b { display: block; font: 400 22px var(--display); color: var(--ink); }
  .lore { color: #b8b0a2; font-weight: 300; font-style: italic; margin: 0 0 22px; }
  .equipNote { display: block; margin-top: 10px; font-size: 13px; color: var(--mute); }
  .hg-foot { display: flex; align-items: center; gap: 30px; padding: 16px 34px; border-top: 1px solid var(--line); }
  .hg-foot small { display: block; font: 600 11px var(--label); letter-spacing: 0.3em; text-transform: uppercase; color: var(--mute); }
  .hg-foot .slot b { font-weight: 500; }
  .hg-foot .slot.changed b { color: var(--a-hi); }
  .hg-foot .push { margin-left: auto; }
  .tabbar { display: flex; align-items: center; gap: 20px; padding: 0 34px; border-bottom: 1px solid var(--line); }
  .tabbar .tabs { padding: 0; border-bottom: 0; }
  .steps { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .steps-lbl { font: 600 11px var(--label); letter-spacing: 0.3em; text-transform: uppercase; color: var(--mute); margin-right: 4px; }
  .step { display: flex; align-items: center; gap: 9px; background: none; border: 0; color: var(--mute); cursor: pointer; font: 600 13px var(--label); letter-spacing: 0.2em; text-transform: uppercase; padding: 6px 2px; transition: color 0.2s; }
  .step i { display: grid; place-items: center; width: 24px; height: 24px; font: 600 12px var(--label); font-style: normal; letter-spacing: 0; border: 1px solid #ffffff33; transform: skewX(-12deg); transition: border-color 0.2s, background 0.2s, color 0.2s; }
  .step:hover { color: var(--ink); }
  .step.active { color: var(--ink); }
  .step.active i { border-color: var(--a); background: #ff6a1a2e; color: var(--a-hi); box-shadow: 0 0 12px #ff6a1a55; }
  .step.done i { border-color: #7dffb2; color: #7dffb2; font-size: 0; }
  .step.done i::after { content: '✓'; font-size: 13px; }
  .steps-line { width: 34px; height: 1px; background: linear-gradient(90deg, #ffffff40, #ffffff10); }
  .act { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 18px; margin: 0 0 24px; }
  .act .equipNote { display: block; margin: 0; flex: 1 1 180px; }
  .hg-foot .status { margin: 0; max-width: 320px; text-shadow: none; }
  .hg-profile { padding: 34px; max-width: 520px; }
  .hg-profile label { display: block; font: 600 12px var(--label); letter-spacing: 0.3em; text-transform: uppercase; color: var(--mute); margin-bottom: 8px; }
  .hg-profile input { width: 100%; font: 400 20px var(--text); color: var(--ink); background: #ffffff0d; border: 1px solid #ffffff26; border-radius: 2px; padding: 12px 14px; outline: none; }
  .hg-profile input:focus { border-color: var(--a); }
  .hg-profile .count { display: flex; justify-content: space-between; margin: 8px 0 22px; font-size: 13px; color: var(--mute); }
  .rar-Abundant { color: #9aa0a6; } .rar-Common { color: #c9c3b8; } .rar-Rare { color: #5aa9ff; } .rar-Epic { color: #c66bff; } .rar-Legendary { color: #ffa53d; } .rar-Mythical { color: #ff4d6d; }

  @media (max-width: 900px) {
    .hud { left: 20px; top: 20px; } .me { right: 20px; top: 20px; } .feed { left: 20px; bottom: 90px; } .loadout { right: 20px; bottom: 20px; left: 20px; align-items: flex-start; text-align: left; } .dtile { width: 84px; height: 112px; } .dock { gap: 16px; }
    .hg-body { grid-template-columns: 1fr; overflow-y: auto; } .list { max-height: 34vh; } .detail { grid-template-columns: 1fr; } .preview { min-height: 240px; }
    .hg-foot { flex-wrap: wrap; gap: 14px; }
  }
</style>
</head></head>
<body>
<canvas id="c"></canvas>
<div class="shade"></div>
<div id="labels" aria-hidden="true"></div>

<header class="hud">
  <div class="eyebrow">Now mining</div>
  <h1 id="pName">–</h1>
  <div class="meter" role="progressbar" aria-label="Share of the planet destroyed" aria-valuemin="0" aria-valuemax="100" id="meter"><i id="meterFill"></i></div>
  <div class="nums"><span><b id="destroyed">0</b> of <b id="total">–</b> blocks gone</span><span><b id="crews">0</b> <span id="crewsWord">crews</span> in orbit</span></div>
</header>

<div class="me" id="meBox">
  <div class="who-wrap">
    <button class="who" id="who" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="meMenu"></button>
    <div class="me-menu" id="meMenu" hidden><button class="link" id="hangarBtn" type="button" hidden>Hangar</button><button class="link" id="signOut" type="button">Sign out</button></div>
  </div>
  <button class="btn small" id="connectBtn" type="button" hidden>Connect wallet</button>
</div>

<div class="feed" id="feed" aria-live="polite"></div>

<div class="loadout" id="loadout" hidden>
  <div class="dock">
    <div class="dtiles">
      <button class="dtile crew" id="tCrew" type="button" aria-label="Your crew"></button>
      <button class="dtile arms" id="tArms" type="button" aria-label="Your weapon"></button>
    </div>

<script>
'use strict';
/*
  Twenty voxel planets (planets-data.js), a fleet you build yourself, and twenty
  weapons (weapons-lib.js) that every ship can switch between at any time.

  Coherent destruction with mixed weapons
  - The planet's look depends only on (planet, seed, blocks removed). Block k of the
    removal sequence is fixed by the seed and the blocks before it, and the sequence
    is grouped into impact sites, so damage concentrates in craters.
  - Attack(n) is fired by one ship: the closest to the crater, the next in turn, or the
    one picked in the HUD. It flies to a firing spot facing the crater and fires volleys
    with whatever weapon it has at that moment. A volley carries a quota of blocks; every hit of the weapon
    hands out a share of that quota (by the size of crater it would make), and those
    blocks are always the next blocks of the sequence. So every weapon digs the same,
    one crater at a time, while its own projectiles, impacts and coloured glow play
    on top. Whatever a volley has not delivered when it ends is delivered then, and
    everything asked for is gone within 3 seconds.
  - So attacking 100 then 150 equals 250 at once, whatever the fleet looks like, and
    planet.set(seed, remaining) rebuilds any state directly.

  Fleet
  - Ships fill orbital shells (6 in the first, 10 in the next, ...). More ships means
    more shells further out, and the camera pulls back to keep the fleet in view.

  Rendering
  - Planet: one instanced draw over a compact list of exposed blocks; only the 3
    camera-facing faces of a block are drawn. Materials (lava, crystal, water, ice,
    metal, energy) are cheap per-block tweaks; glowing parts feed a bloom pass.

  API
    planet.attack(n, shipId?)        n more blocks, fired by one ship, gone within 3 s
    planet.set(seed, remaining)      jump straight to that state
    planet.select(name)              switch planet (full, untouched)
    planet.fleet.add(design, weapon, name?) -> id      design: fighter | interceptor | frigate
    planet.fleet.remove(id) / .setWeapon(id, weapon) / .setName(id, name) / .setAll(weapon) / .list()
    planet.weapons                   the 20 weapon names
*/
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance', preserveDrawingBuffer: false });
if (!gl) {
  document.body.innerHTML = '<div class="err">WebGL2 is not available in this browser.</div>';
  throw new Error('no webgl2');
}
const { PLANETS } = PlanetKit;
const { WEAPONS } = WeaponKit;
const { add, sub, scale, dot, cross, norm, len, rnd, C3, rotateAround } = WeaponKit.util;
function slerp(a, b, t) {   // unit vectors
  const c = Math.max(-1, Math.min(1, dot(a, b))), th = Math.acos(c);
  if (th < 1e-3) return b;
  if (th > Math.PI - 1e-3) b = norm(add(b, cross(a, [0.3, 1, 0.2])));   // opposite: go round, not through
  const th2 = Math.acos(Math.max(-1, Math.min(1, dot(a, b)))), s = Math.sin(th2);
  return norm(add(scale(a, Math.sin((1 - t) * th2) / s), scale(b, Math.sin(t * th2) / s)));
}
// weapons are Alien Worlds arms, keyed "Name|Shine"; each is built (and measured) the first time it is used
const AW_ARMS = Object.fromEntries(AW_DATA.arms.map(a => [a.name, a]));
const hexOf = c => '#' + c.map(v => Math.round(Math.max(0, Math.min(1, v)) * 255).toString(16).padStart(2, '0')).join('');
function awWeapon(key) {
  const [name, shine = 'Stone'] = String(key).split('|'), a = AW_ARMS[name] || AW_ARMS['Standard Sword'];
  const pal = AWDesign.CLASS_PAL[a.class] || AWDesign.CLASS_PAL.Neutral;
  return { name: key, heat: hexOf(pal.main), fire: A => AWDesign.ARMS[a.name](A, AWDesign.makeTier(A, a.rarity, shine, a.class)) };
}
const lazy = make => new Proxy({}, { get(t, k) { if (typeof k !== 'string') return undefined; if (!(k in t)) t[k] = make(k); return t[k]; }, has: () => true });
const WEAPON_BY_NAME = lazy(awWeapon);
const MEASURE = lazy(k => WeaponKit.measure(WEAPON_BY_NAME[k]));
const DEFAULT_WEAPON = 'Standard Sword|Stone';

const SLOTS = 64;          // frames of removals that can be melting at once
const MELT = 0.55;         // seconds for a hit block to melt away
const ATTACK_SECONDS = 3;  // everything asked for is destroyed within this time
const HALOS = { Magor: [1, 0.42, 0.12], Cinder: [1, 0.42, 0.12], Janus: [1, 0.5, 0.25], Bog: [0.5, 1, 0.3],
  Brine: [1, 0.6, 0.75], Lantern: [1, 0.9, 0.5], Geode: [0.75, 0.55, 1], Dune: [1, 0.7, 0.4], Halo: [1, 0.8, 0.55] };

// ---------------------------------------------------------------------------
// shaders
const FACES = `const vec3 F[7] = vec3[7](
  vec3( 1, 1, 1), vec3(-1, 1, 1), vec3( 1,-1, 1), vec3( 1, 1,-1),
  vec3(-1,-1, 1), vec3(-1, 1,-1), vec3( 1,-1,-1));
float hash(uint x) {
  x ^= x >> 16; x *= 0x7feb352du; x ^= x >> 15; x *= 0x846ca68bu; x ^= x >> 16;
  return float(x & 65535u) / 65535.0;
}`;
const SURF_OUT = `out vec3 vLocal;
out highp vec3 vPos;
flat out vec3 vBase;
flat out vec3 vEm;
flat out float vMat;
flat out float vRnd;
flat out vec3 vSN;`;

// planet blocks
const PLANET_VS = `#version 300 es
precision highp float;
precision highp int;
precision highp usampler3D;
precision highp sampler3D;
layout(location = 0) in uint aCell;
layout(location = 1) in uvec4 aCol;    // rgb, material << 5 | glow
uniform mat4 uMVP;
uniform vec3 uCam;
uniform int uN;
uniform float uT, uMelt;
uniform usampler3D uMask;       // 0 exposed, 1..64 melting in slot k, 254 buried, 255 empty
uniform sampler3D uHeatT;       // when this block's crater glow started
uniform sampler3D uHeatC;       // colour of that glow (the weapon that caused it)
uniform float uSlotT[${SLOTS}];
${SURF_OUT}
${FACES}
void main() {
  int id = int(aCell);
  ivec3 ic = ivec3(id % uN, (id / uN) % uN, id / (uN * uN));
  uint m = texelFetch(uMask, ic, 0).r;
  if (m >= 254u) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
  float fn = float(uN);
  vec3 g = (vec3(ic) + 0.5) / fn * 2.0 - 1.0;
  float h = 1.0 / fn;
  float heat;
  if (m > 0u) {
    float k = (uT - uSlotT[int(m) - 1]) / uMelt;
    if (k >= 1.0) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
    h *= 1.0 - smoothstep(0.0, 1.0, k);
    heat = 1.0;
  } else {
    float age = uT - texelFetch(uHeatT, ic, 0).r;
    heat = min(1.0, exp(-age * 1.1) + 0.8 * exp(-age * 9.0));
  }
  vec3 s = sign(uCam - g);
  s += vec3(equal(s, vec3(0.0)));
  vec3 loc = F[gl_VertexID] * s;
  vec3 pos = g + loc * h;
  gl_Position = uMVP * vec4(pos, 1.0);
  vLocal = loc; vPos = pos; vSN = normalize(g + 1e-6);

  float rnd = hash(uint(id));
  float mat = float(aCol.a >> 5u);
  float glow = float(aCol.a & 31u) / 31.0;
  vec3 base = vec3(aCol.rgb) / 255.0;
  float lava = 1.0 - min(abs(mat - 1.0), 1.0), energy = 1.0 - min(abs(mat - 6.0), 1.0);
  // lava: slow churning hot spots plus a per-block flicker; energy: gentle breathing
  float churn = sin(dot(g, vec3(5.3, 4.1, 6.7)) * 2.5 + uT * 0.7) * sin(dot(g, vec3(-3.7, 6.1, 2.3)) * 2.0 - uT * 0.5);
  float k = 1.0 + lava * (0.18 * sin(uT * 2.3 + rnd * 6.28) + 0.35 * churn) + energy * 0.15 * sin(uT * 1.5 + rnd * 6.28);
  vec3 hot = mix(base, vec3(1.0, 0.85, 0.5), lava * max(churn, 0.0) * 0.5);
  vec3 heatCol = texelFetch(uHeatC, ic, 0).rgb * 1.7;
  vBase = base;
  vEm = hot * glow * 1.4 * k + heatCol * heat + vec3(1.2, 1.0, 0.85) * pow(heat, 4.0) * 1.4;
  vMat = mat;
  vRnd = rnd;
}`;

// ships and projectiles: voxels in their own local space
const VOX_VS = `#version 300 es
precision highp float;
precision highp int;
layout(location = 0) in vec3 aVox;
layout(location = 1) in uvec4 aCol;
uniform mat4 uMVP;
uniform vec3 uCam;    // local space
uniform float uT;
${SURF_OUT}
${FACES}
void main() {
  vec3 s = sign(uCam - aVox);
  s += vec3(equal(s, vec3(0.0)));
  vec3 loc = F[gl_VertexID] * s;
  vec3 pos = aVox + loc * 0.5;
  gl_Position = uMVP * vec4(pos, 1.0);
  vLocal = loc; vPos = pos; vSN = vec3(0.0, 1.0, 0.0);
  float rnd = hash(uint(gl_InstanceID) * 7919u + 13u);
  float mat = float(aCol.a >> 5u);
  float glow = float(aCol.a & 31u) / 31.0;
  vec3 base = vec3(aCol.rgb) / 255.0;
  float energy = 1.0 - min(abs(mat - 6.0), 1.0);
  vBase = base;
  vEm = base * glow * 1.5 * (1.0 + energy * 0.25 * sin(uT * 23.0 + rnd * 6.28));
  vMat = mat;
  vRnd = rnd;
}`;

// shared surface shading with the material effects
const SURF_FS = `#version 300 es
precision mediump float;
uniform vec3 uLight;
uniform highp vec3 uCam;
uniform highp float uT;
uniform float uSNw;     // how much the sphere normal softens lighting (planet only)
in vec3 vLocal;
in highp vec3 vPos;
flat in vec3 vBase;
flat in vec3 vEm;
flat in float vMat;
flat in float vRnd;
flat in vec3 vSN;
layout(location = 0) out vec4 o;
layout(location = 1) out vec4 oGlow;
float is(float m) { return 1.0 - min(abs(vMat - m), 1.0); }
void main() {
  // branchless face pick (an if/else chain here fails to compile on ANGLE's D3D11 backend)
  vec3 a = abs(vLocal);
  float mx = step(max(a.y, a.z), a.x);
  float my = (1.0 - mx) * step(a.z, a.y);
  vec3 m = vec3(mx, my, 1.0 - mx - my);
  vec3 n = m * sign(vLocal);
  vec3 tt = a * (1.0 - m);
  float e = max(max(tt.x, tt.y), tt.z);
  float fw = fwidth(e);
  float edgeK = (1.0 - smoothstep(0.08, 0.3, fw)) * smoothstep(0.78 - fw, 1.0 - fw * 0.5, e);

  float crystal = is(2.0), water = is(3.0), ice = is(4.0), metal = is(5.0);
  float plain = 1.0 - crystal - water - ice - metal;

  vec3 nl = normalize(n * 0.75 + vSN * uSNw);
  vec3 V = normalize(uCam - vPos);
  // per-block shimmer on water (a positional wave drew moire rings) and crystal facets
  vec3 rip = vec3(sin(uT * 1.7 + vRnd * 40.0), sin(uT * 1.3 + vRnd * 57.0), sin(uT * 1.1 + vRnd * 23.0)) * 0.12;
  vec3 jit = (fract(vec3(vRnd * 13.1, vRnd * 71.7, vRnd * 37.3)) - 0.5) * 0.7;
  vec3 ne = normalize(nl + rip * water + jit * crystal);
  float d = max(dot(ne, uLight), 0.0);
  float ndh = max(dot(ne, normalize(uLight + V)), 0.0);
  float fres = pow(1.0 - max(dot(ne, V), 0.0), 4.0);
  float sp = (pow(ndh, 40.0) * 0.2 * plain + pow(ndh, 140.0) * 2.6 * crystal + pow(ndh, 90.0) * 1.8 * water
            + pow(ndh, 60.0) * 0.9 * ice + pow(ndh, 28.0) * 1.1 * metal) * smoothstep(0.0, 0.15, d);

  vec3 col = vBase * (0.07 + 1.05 * d * (1.0 - 0.45 * metal)) * (1.0 - 0.3 * edgeK)
           + sp * mix(vec3(1.0), vBase, metal * 0.7)
           + vec3(0.35, 0.5, 0.7) * fres * water * 0.5 + vec3(0.8, 0.9, 1.0) * fres * ice * 0.35 + vBase * fres * crystal * 0.6;
  float tw = pow(max(sin(uT * 1.7 + vRnd * 60.0), 0.0), 60.0) * crystal;   // occasional twinkle
  vec3 em = vEm * (1.0 - 0.2 * edgeK) + vec3(1.0, 0.95, 1.0) * tw * 1.2;
  col += em;
  col = col / (1.0 + col * 0.25);
  o = vec4(pow(col, vec3(0.92)), 1.0);
  oGlow = vec4(em * 0.5 + sp * (water + crystal) * 0.12, 1.0);
}`;

const FULL_VS = `#version 300 es
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)) * 2.0 - 1.0;
  gl_Position = vec4(p, 0.0, 1.0);
}`;
// particles: additive glow, or alpha-blended (smoke, dust, dark matter)
const PART_VS = `#version 300 es
precision highp float;
layout(location = 0) in vec4 aP;   // xyz, size in world units
layout(location = 1) in vec4 aC;   // rgb, intensity / opacity
uniform mat4 uVP;
uniform float uPx;
out vec4 vC;
void main() {
  gl_Position = uVP * vec4(aP.xyz, 1.0);
  gl_PointSize = clamp(aP.w * uPx / gl_Position.w, 1.0, 256.0);
  vC = aC;
}`;
const PART_ADD_FS = `#version 300 es
precision mediump float;
in vec4 vC;
layout(location = 0) out vec4 o;
layout(location = 1) out vec4 oGlow;
void main() {
  vec2 q = gl_PointCoord * 2.0 - 1.0;
  float f = max(1.0 - dot(q, q), 0.0);
  f *= f;
  vec3 c = vC.rgb * vC.a * f;
  o = vec4(c, 1.0);
  oGlow = vec4(c * 0.6, 1.0);
}`;
const PART_ALPHA_FS = `#version 300 es
precision mediump float;
in vec4 vC;
layout(location = 0) out vec4 o;
layout(location = 1) out vec4 oGlow;
void main() {
  vec2 q = gl_PointCoord * 2.0 - 1.0;
  float f = max(1.0 - dot(q, q), 0.0);
  float a = vC.a * f * f;
  o = vec4(vC.rgb * a, a);
  oGlow = vec4(0.0, 0.0, 0.0, a);
}`;

// bloom
const DOWN_FS = `#version 300 es
precision mediump float;
uniform sampler2D uTex;
uniform vec2 uSrcTexel;
uniform vec2 uDst;
out vec4 o;
void main() {
  vec2 uv = gl_FragCoord.xy / uDst;
  vec2 t = uSrcTexel;
  o = 0.25 * (texture(uTex, uv + vec2(-t.x, -t.y)) + texture(uTex, uv + vec2(t.x, -t.y))
            + texture(uTex, uv + vec2(-t.x, t.y)) + texture(uTex, uv + vec2(t.x, t.y)));
}`;
const BLUR_FS = `#version 300 es
precision mediump float;
uniform sampler2D uTex;
uniform vec2 uStep;
uniform vec2 uDst;
out vec4 o;
void main() {
  vec2 uv = gl_FragCoord.xy / uDst;
  o = texture(uTex, uv) * 0.227
    + (texture(uTex, uv + uStep * 1.385) + texture(uTex, uv - uStep * 1.385)) * 0.316
    + (texture(uTex, uv + uStep * 3.231) + texture(uTex, uv - uStep * 3.231)) * 0.070;
}`;
const COMP_FS = `#version 300 es
precision mediump float;
uniform sampler2D uScene, uB1, uB2;
uniform vec2 uDst;
out vec4 o;
void main() {
  vec2 uv = gl_FragCoord.xy / uDst;
  o = vec4(texture(uScene, uv).rgb + texture(uB1, uv).rgb * 1.3 + texture(uB2, uv).rgb * 1.1, 1.0);

function compile(type, src) {

  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));

  const u = new Proxy(cache, { get: (c, n) => (n in c ? c[n] : (c[n] = gl.getUniformLocation(p, n))) });

const sky = SpaceSky.create(gl);   // galaxies, nebulae, stars (baked once)
const IDX = new Uint8Array([0,2,6, 0,6,3, 0,3,5, 0,5,1, 0,1,4, 0,4,2]);   // 3 faces around corner 0
const ibo = gl.createBuffer();

// render targets: MSAA scene with a second "glow" attachment, resolved, then bloom
const SAMPLES = Math.min(4, gl.getParameter(gl.MAX_SAMPLES));

function tex2d(w, h) {

  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  return { t, f, w, h };
}
function makeTargets(w, h) {
  if (RT) {
    for (const k of ['scene', 'glow', 'a1', 'b1', 'a2', 'b2']) { gl.deleteTexture(RT[k].t); gl.deleteFramebuffer(RT[k].f); }
    for (const rb of RT.rbs) gl.deleteRenderbuffer(rb);

  gl.bindFramebuffer(gl.FRAMEBUFFER, ms);

    const rb = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, rb);
    gl.renderbufferStorageMultisample(gl.RENDERBUFFER, SAMPLES, fmt, w, h);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, i === 2 ? gl.DEPTH_ATTACHMENT : gl.COLOR_ATTACHMENT0 + i, gl.RENDERBUFFER, rb);
    return rb;

  RT = { w, h, ms, rbs, scene: tex2d(w, h), glow: tex2d(w, h), a1: tex2d(...q1), b1: tex2d(...q1), a2: tex2d(...q2), b2: tex2d(...q2) };

      face = surfaceTarget(s.aimDir).p;
    } else { goal = orbPos; goalVel = orbVel; }
    // fly along the curve of the planet towards the goal (never through it), holding the
    // shell's height; only the last stretch is a straight line in
    const pd = norm(s.pos), gd = norm(goal), r = len(s.pos), rG = len(goal);
    const ang = Math.acos(Math.max(-1, Math.min(1, dot(pd, gd))));
    const remaining = ang * r + Math.abs(rG - r);
    const speed = FLY.maxSpeed * Math.min(1, remaining / FLY.slow);   // full speed until close, then ease off
    let desired;
    if (ang > 0.15) {
      let along = sub(gd, scale(pd, dot(gd, pd)));
      along = len(along) > 1e-4 ? norm(along) : basis(pd)[0];
      desired = add(scale(along, speed), scale(pd, (rG - r) * 2.5));
    } else {
      const to = sub(goal, s.pos), d = len(to);
      desired = d > 1e-6 ? scale(to, speed / d) : [0, 0, 0];
    }
    desired = add(desired, goalVel);   // keep pace with a moving goal (the orbit)
    acc = scale(sub(desired, s.vel), FLY.response);   // reach the wanted velocity in ~1/response s (damps the height hold)
    const al = len(acc), lim = FLY.maxAcc;
    if (al > lim) acc = scale(acc, lim / al);
    if (dt > 0) {
      s.vel = add(s.vel, scale(acc, dt));
      s.pos = add(s.pos, scale(s.vel, dt));
      // keep clear of the surface
      const rKeep = PRg * 1.3, r = len(s.pos);
      if (r < rKeep) {
        const out = scale(s.pos, 1 / r);
        s.pos = scale(out, rKeep);
        const vin = dot(s.vel, out);
        if (vin < 0) s.vel = sub(s.vel, scale(out, vin));
      }
    }
    const dGoal = len(sub(goal, s.pos)), sp = len(s.vel);
    if (!engaged && dGoal < 0.03) s.mode = 'orbit';   // merged back into the orbit
    // nose along the flight path; near the firing spot, turn to face the crater
    if (face && dGoal < 0.45) wantFwd = norm(sub(face, s.pos));
    else wantFwd = sp > 0.05 ? scale(s.vel, 1 / sp) : s.fwd;
  }
  // turn towards the wanted heading at a limited rate
  const c = Math.max(-1, Math.min(1, dot(s.fwd, wantFwd))), th = Math.acos(c);
  s.fwd = th < 1e-4 || dt === 0 ? (dt === 0 ? s.fwd : wantFwd) : slerp(s.fwd, wantFwd, Math.min(1, FLY.turn * dt / th));
  // up = away from the planet, banked into the turn
  const out = norm(s.pos);
  let up = sub(out, scale(s.fwd, dot(out, s.fwd)));
  if (len(up) < 0.2) up = sub(s.up, scale(s.fwd, dot(s.up, s.fwd)));   // looking straight down: keep the last roll
  up = norm(up);
  const right = cross(up, s.fwd);
  const rollWant = Math.max(-0.7, Math.min(0.7, -dot(acc, right) * 0.12));
  if (dt > 0) s.roll += (rollWant - s.roll) * Math.min(1, dt * 4);
  s.up = norm(add(scale(up, Math.cos(s.roll)), scale(right, Math.sin(s.roll))));
  s.right = cross(s.up, s.fwd);
}

function frame(now) {
  const rawDt = Math.min(1, (now - last) / 1000), dt = Math.min(0.1, rawDt); last = now;
  resize();
  if (!paused) {
    clock += dt;
    simT += rawDt;   // real time, so attacks finish within 3 s even when frames are slow
    spin += dt * 0.07;
  }
  const W = canvas.width, H = canvas.height, aspect = W / H;

  // ---- ships on their shells; the camera backs off as the fleet grows
  let outer = 1.6 * orbitScale();
  for (const s of fleet) {
    s.rCur += (s.rTarget - s.rCur) * Math.min(1, dt * 1.2);
    const speed = 0.3 * Math.pow(1.6 * orbitScale() / Math.max(s.rCur, 0.1), 1.5) * s.dirSign;
    if (!paused) s.angle += speed * rawDt;
    const ci = Math.cos(s.incl), si = Math.sin(s.incl), cn = Math.cos(s.node), sn = Math.sin(s.node);
    const orb = p => { const y = p[2] * si, z = p[2] * ci; return [p[0] * cn - z * sn, y, p[0] * sn + z * cn]; };
    const orbPos = orb([Math.cos(s.angle) * s.rCur, 0, Math.sin(s.angle) * s.rCur]);
    const orbFwd = norm(orb([-Math.sin(s.angle) * s.dirSign, 0, Math.cos(s.angle) * s.dirSign]));
    const orbVel = scale(orbFwd, Math.abs(speed) * s.rCur);
    flyShip(s, orbPos, orbFwd, orbVel, paused ? 0 : dt);
    outer = Math.max(outer, s.rTarget);
  }
  const distBase = Math.max(5.4, outer * 2.5 + 0.8);
  dist += (distBase * userZoom - dist) * Math.min(1, dt * 2.5);

  // ---- volleys: launch what is due, enforce deadlines, play the effects
  if (!paused) {
    for (let i = 0; i < volleys.length && volleys[i].at <= simT; i++) if (launchVolley(volleys[i])) volleys.splice(i--, 1);
    for (const tag of active) if (simT >= tag.deadline && tag.left > 0) deliver(tag, tag.left);
    world.update(rawDt);
  }
  for (let s = 0; s < SLOTS; s++) if (slots[s] && clock - slots[s].t > MELT) retire(s);

  // ---- matrices
  const fovy = aspect < 1 ? 2 * Math.atan(Math.tan(0.39) / aspect) : 0.78;
  const fy = 1 / Math.tan(fovy / 2);
  const far = Math.max(60, dist * 4);
  const P = perspective(fovy, aspect, 0.05, far);
  const viewRot = mul(rotX(pitch), rotY(yaw));
  const VP = mul(P, mul(translate(0, 0, -dist), viewRot));
  const camW = toObj(viewRot, [0, 0, dist]);
  const Spin = rotY(spin);

  let q = null;
  if (timerExt && queries.length < 4) { q = gl.createQuery(); gl.beginQuery(timerExt.TIME_ELAPSED_EXT, q); }

  // ---- scene into the MSAA target (colour + glow)
  gl.bindFramebuffer(gl.FRAMEBUFFER, RT.ms);
  gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
  gl.viewport(0, 0, W, H);
  gl.clearBufferfv(gl.COLOR, 0, [0, 0, 0, 1]);
  gl.clearBufferfv(gl.COLOR, 1, [0, 0, 0, 1]);
  gl.clearBufferfv(gl.DEPTH, 0, [1]);

  gl.disable(gl.DEPTH_TEST);
  const sunV = toView(viewRot, LW);
  sky.draw(mul(P, viewRot), 2 * Math.tan(fovy / 2) / H, clock, {
    c: [W / 2, H / 2],
    rad: PRg * fy / Math.sqrt(Math.max(1e-4, dist * dist - PRg * PRg)) * H / 2,
    atm: total ? 0.35 + 0.65 * (total - removed) / total : 0,
    tint: HALOS[def.name] || [0.45, 0.65, 1.0],
    sun: norm([sunV[0], sunV[1], 0]).slice(0, 2),
  });
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LESS);

  // planet
  uploadList();
  flushUploads();
  gl.useProgram(planetProg.p);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_3D, heatCTex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_3D, heatTex);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_3D, maskTex);
  let u = planetProg.u;
  gl.uniform1i(u.uMask, 0); gl.uniform1i(u.uHeatT, 1); gl.uniform1i(u.uHeatC, 2);
  gl.uniformMatrix4fv(u.uMVP, false, mul(VP, Spin));
  gl.uniform3fv(u.uCam, toObj(Spin, camW));
  gl.uniform3fv(u.uLight, toObj(Spin, LW));
  gl.uniform1i(u.uN, N);
  gl.uniform1f(u.uT, clock);
  gl.uniform1f(u.uMelt, MELT);
  gl.uniform1fv(u.uSlotT, slotT);
  gl.uniform1f(u.uSNw, 0.75);
  gl.bindVertexArray(planetVao);
  gl.drawElementsInstanced(gl.TRIANGLES, 18, gl.UNSIGNED_BYTE, 0, listLen);

  // ships and projectiles
  gl.useProgram(voxProg.p);
  u = voxProg.u;
  gl.uniform1f(u.uT, clock);
  gl.uniform1f(u.uSNw, 0);
  for (const s of fleet) drawVox(s.model, s.right, s.up, s.fwd, shipScale(s), s.pos, VP, camW);
  for (const pj of world.W.projs) {
    if (!pj.model) continue;
    let f = pj.phase === 'dig' ? scale(pj.to.n, -1) : pj.dir;
    const up0 = Math.abs(f[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
    let r = norm(cross(up0, f)), up = cross(f, r);
    if (pj.spin) { const a = simT * pj.spin; r = rotateAround(r, f, a); up = rotateAround(up, f, a); }
    drawVox(MODELS[pj.model], r, up, f, pj.scale || 0.02, pj.pos, VP, camW);
  }

  // particles: smoke first (alpha), then glow (additive); neither writes depth
  gl.depthMask(false);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  drawParticles(world.W.alpha, alphaProg, VP, fy * H / 2);
  gl.blendFunc(gl.ONE, gl.ONE);
  // many overlapping volleys would wash the scene out white: dim the glow a little as they pile up
  drawParticles(world.W.add, addProg, VP, fy * H / 2, 1 / Math.sqrt(Math.max(1, active.size / 6)));
  gl.disable(gl.BLEND);
  gl.depthMask(true);

  // ---- resolve MSAA, bloom, composite
  gl.disable(gl.DEPTH_TEST);
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, RT.ms);
  gl.readBuffer(gl.COLOR_ATTACHMENT0);
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, RT.scene.f);
  gl.blitFramebuffer(0, 0, W, H, 0, 0, W, H, gl.COLOR_BUFFER_BIT, gl.NEAREST);
  gl.readBuffer(gl.COLOR_ATTACHMENT1);
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, RT.glow.f);
  gl.blitFramebuffer(0, 0, W, H, 0, 0, W, H, gl.COLOR_BUFFER_BIT, gl.NEAREST);
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null);
  gl.bindVertexArray(emptyVao);
  pass(downProg, RT.a1, u => { bindTex(0, RT.glow.t); gl.uniform1i(u.uTex, 0); gl.uniform2f(u.uSrcTexel, 1 / W, 1 / H); });
  pass(blurProg, RT.b1, u => { bindTex(0, RT.a1.t); gl.uniform1i(u.uTex, 0); gl.uniform2f(u.uStep, 1 / RT.a1.w, 0); });
  pass(blurProg, RT.a1, u => { bindTex(0, RT.b1.t); gl.uniform1i(u.uTex, 0); gl.uniform2f(u.uStep, 0, 1 / RT.a1.h); });
  pass(downProg, RT.a2, u => { bindTex(0, RT.a1.t); gl.uniform1i(u.uTex, 0); gl.uniform2f(u.uSrcTexel, 0.5 / RT.a1.w, 0.5 / RT.a1.h); });
  pass(blurProg, RT.b2, u => { bindTex(0, RT.a2.t); gl.uniform1i(u.uTex, 0); gl.uniform2f(u.uStep, 1 / RT.a2.w, 0); });
  pass(blurProg, RT.a2, u => { bindTex(0, RT.b2.t); gl.uniform1i(u.uTex, 0); gl.uniform2f(u.uStep, 0, 1 / RT.a2.h); });
  pass(compProg, null, u => {
    bindTex(0, RT.scene.t); bindTex(1, RT.a1.t); bindTex(2, RT.a2.t);
    gl.uniform1i(u.uScene, 0); gl.uniform1i(u.uB1, 1); gl.uniform1i(u.uB2, 2);
  });
  gl.activeTexture(gl.TEXTURE0);
  gl.bindVertexArray(null);

  if (q) { gl.endQuery(timerExt.TIME_ELAPSED_EXT); queries.push(q); }
  if (timerExt && queries.length) {
    const head = queries[0];
    if (gl.getQueryParameter(head, gl.QUERY_RESULT_AVAILABLE)) {
      if (!gl.getParameter(timerExt.GPU_DISJOINT_EXT)) gpuMs = gl.getQueryParameter(head, gl.QUERY_RESULT) / 1e6;
      gl.deleteQuery(head); queries.shift();
    }
  }

  placeLabels(VP, camW);
  if (window.onFrame) window.onFrame(rawDt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
<script type="module" src="play.js"></script>
